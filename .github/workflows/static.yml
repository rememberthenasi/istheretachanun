# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the deployment branch
  push:
    branches: ["PWA-Enabled"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Rebuild weekly so the "upcoming dates" on the generated pages and the
  # sitemap stay current even when nothing is pushed.
  schedule:
    - cron: '17 4 * * 0'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the rules module
        run: npm test
      - name: Build the JSON feed (feed/)
        run: npm run build:feed
      - name: Build the SEO pages (holidays/, tachanun-calendar/, sitemap.xml, ...)
        run: npm run build:pages
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      # Tell IndexNow search engines (Bing, Yandex, Seznam, Naver...) that the
      # pages changed. The key file at the site root proves we own the domain.
      # Only on pushes, so the weekly rebuild does not ping every week; a
      # failure here never fails the deploy.
      - name: Notify search engines (IndexNow)
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          INDEXNOW_KEY: 725463dddd5a6c71c5fe930895549e67
        run: |
          grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's/<loc>//' -e 's#</loc>##' \
            | jq -R . | jq -s --arg key "$INDEXNOW_KEY" \
              '{host: "istheretachanun.com", key: $key, keyLocation: ("https://istheretachanun.com/" + $key + ".txt"), urlList: .}' > indexnow.json
          curl -sS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST \
            -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json https://api.indexnow.org/indexnow
