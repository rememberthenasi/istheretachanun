# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the deployment branch
  push:
    branches: ["PWA-Enabled"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Rebuild weekly so the "upcoming dates" on the generated pages and the
  # sitemap stay current even when nothing is pushed.
  schedule:
    - cron: '17 4 * * 0'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages,
# and to commit the regenerated feed and pages back to the branch.
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the rules module
        run: npm test
      # One timestamp per UTC day, so rebuilding on the same day produces
      # identical files and the commit step below has nothing to commit.
      - name: Build the JSON feed (feed/) and the SEO pages (holidays/, tachanun-calendar/, sitemap.xml, ...)
        run: |
          NOW="$(date -u +%F)T00:00:00Z"
          node scripts/build-feed.js --out feed --now "$NOW"
          node scripts/build-pages.js --now "$NOW"
      # The generated files are committed too, so hosts that publish the
      # repository as-is (Cloudflare Pages with any build command, or none)
      # serve them. This runs before the GitHub Pages steps so a failed Pages
      # deploy cannot stop the refresh. Pushes made with GITHUB_TOKEN do not
      # start this workflow again, so this cannot loop.
      - name: Commit the regenerated feed and pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A feed holidays tachanun-calendar what-is-tachanun faq 404.html sitemap.xml llms.txt
          if git diff --cached --quiet; then echo "Generated files are already up to date."; exit 0; fi
          git commit -m "Regenerate the JSON feed and SEO pages"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      # Tell IndexNow search engines (Bing, Yandex, Seznam, Naver...) that the
      # pages changed. The key file at the site root proves we own the domain.
      # Only on pushes, so the weekly rebuild does not ping every week; a
      # failure here never fails the deploy.
      - name: Notify search engines (IndexNow)
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          INDEXNOW_KEY: 725463dddd5a6c71c5fe930895549e67
        run: |
          grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's/<loc>//' -e 's#</loc>##' \
            | jq -R . | jq -s --arg key "$INDEXNOW_KEY" \
              '{host: "istheretachanun.com", key: $key, keyLocation: ("https://istheretachanun.com/" + $key + ".txt"), urlList: .}' > indexnow.json
          curl -sS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST \
            -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json https://api.indexnow.org/indexnow
