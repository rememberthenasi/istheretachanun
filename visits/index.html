<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Visits</title>
  <style>
    :root {
      --bg: #171614;
      --surface: #1c1b19;
      --border: #393836;
      --text: #cdccca;
      --muted: #8a8987;
      --accent: #4f98a3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .card {
      width: min(560px, 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      padding: 1.25rem;
      display: grid;
      gap: 0.65rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }
    #visitCount {
      margin: 0;
      font-size: clamp(2rem, 1.25rem + 4vw, 3rem);
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }
    p {
      margin: 0;
      color: var(--muted);
    }
    a {
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Total Site Visits</h1>
    <p id="visitCount" aria-live="polite">Loading…</p>
    <p>Counter tracks page loads for the main app.</p>
    <p><a href="/">Back to site</a></p>
  </main>

  <script>
    (async () => {
      const visitCountEl = document.getElementById('visitCount');
      const namespace = 'rememberthenasi-istheretachanun';
      const key = 'site-visits-total';
      try {
        const response = await fetch(`https://api.countapi.xyz/get/${namespace}/${key}`, { cache: 'no-store' });
        const data = await response.json();
        const count = Number.isFinite(Number(data?.value)) ? Number(data.value) : 0;
        visitCountEl.textContent = count.toLocaleString();
      } catch (error) {
        visitCountEl.textContent = 'Unavailable';
      }
    })();
  </script>
</body>
</html>
